<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contatos</title>
<style>
  :root {
    --ink: #1c2b2d;
    --paper: #f6f4ef;
    --line: #d8d2c4;
    --accent: #2f6f5e;
    --accent-soft: #e4ede9;
    --muted: #6b6459;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }

  .wrap {
    width: 100%;
    max-width: 440px;
  }

  .logo {
    display: block;
    height: 34px;
    width: auto;
    margin: 0 auto 18px;
  }

  .titulo {
    text-align: center;
    margin-bottom: 28px;
  }

  .titulo h1 {
    font-size: 1.4rem;
    letter-spacing: 0.02em;
    margin: 0 0 4px;
  }

  .titulo p {
    margin: 0;
    color: var(--muted);
    font-size: 0.9rem;
  }

  /* ============================================= */
  /* CADA CONTATO É UM BLOCO ".card" ABAIXO NO HTML */
  /* Edite nome, cargo, telefone e email ali dentro  */
  /* ============================================= */

  .card {
    background: white;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px 22px;
    margin-bottom: 16px;
    position: relative;
  }

  .card.desligado {
    opacity: 0.55;
  }

  .card.desligado::after {
    content: "Contato inativo";
    position: absolute;
    top: 18px;
    right: 20px;
    font-size: 0.7rem;
    color: #b3463f;
    border: 1px solid #b3463f;
    border-radius: 20px;
    padding: 2px 10px;
  }

  .nome {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0 0 2px;
  }

  .cargo {
    font-size: 0.85rem;
    color: var(--muted);
    margin: 0 0 14px;
  }

  .linhas {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .linha {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--ink);
    font-size: 0.92rem;
    padding: 8px 10px;
    border-radius: 8px;
    background: var(--accent-soft);
  }

  .linha:active {
    opacity: 0.8;
  }

  .icone {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    color: var(--accent);
  }

  .rodape {
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
    margin-top: 24px;
  }
</style>
</head>
<body>
